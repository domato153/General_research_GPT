<text x="93" y="523" font-size="16" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif">미국 성인 중 전쟁·해외분쟁을 미국의 단일 최대 문제로 선택한 비율</text><text x="93" y="548" font-size="15" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif">중간선거 투표 중요도나 트럼프 국정 승인율과 구별. 직접적인 인과효과 식별 불가.</text><text x="93" y="576" font-size="14">Source: Reuters/Ipsos Feb, Mar 20-23, Apr 24-27 2026; W7 round 3</text></svg>
