<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="386" viewBox="0 0 1160 386" role="img" aria-labelledby="title desc"><title id="title">Florida 제14하원선거구 광고비 비교</title><desc id="desc">Washington Post AdImpact 2026-10-07 누적 광고 지출, 단위 백만 미국달러: 공화당 6.3, 민주당 3.8. 후보자 전체 모금액/잔고가 아님.</desc><rect width="1160" height="386" fill="white"/><text x="65" y="53" font-size="26" font-weight="700" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif">Florida 제14하원선거구: 광고지출 양당 비교</text><text x="65" y="86" font-size="17" fill="#51677c" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif">AdImpact · 2026-10-07 보도 · USD 백만 달러 · 전체 스케일 0~10</text><line x1="360" y1="115" x2="360" y2="290" stroke="#e1e7ef"/><text x="360" y="318" text-anchor="middle" font-size="14" fill="#66778b">0</text><line x1="535" y1="115" x2="535" y2="290" stroke="#e1e7ef"/><text x="535" y="318" text-anchor="middle" font-size="14" fill="#66778b">2.5</text><line x1="710" y1="115" x2="710" y2="290" stroke="#e1e7ef"/><text x="710" y="318" text-anchor="middle" font-size="14" fill="#66778b">5</text><line x1="885" y1="115" x2="885" y2="290" stroke="#e1e7ef"/><text x="885" y="318" text-anchor="middle" font-size="14" fill="#66778b">7.5</text><line x1="1060" y1="115" x2="1060" y2="290" stroke="#e1e7ef"/><text x="1060" y="318" text-anchor="middle" font-size="14" fill="#66778b">10</text><text x="345" y="180" text-anchor="end" font-size="19" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif">공화당 측</text><rect x="360" y="155" width="441" height="39" rx="5" fill="#b35f57" data-key="gop" data-value="6.3"/><text x="813" y="182" font-size="20" font-weight="600">6.3m</text><text x="345" y="256" text-anchor="end" font-size="19" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif">민주당 측</text><rect x="360" y="231" width="266" height="39" rx="5" fill="#3670b6" data-key="dem" data-value="3.8"/><text x="638" y="258" font-size="20" font-weight="600">3.8m</text><text x="65" y="357" font-size="14" fill="#53677e">양당 약 10.