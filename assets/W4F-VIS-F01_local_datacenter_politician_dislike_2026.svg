<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="449" viewBox="0 0 1160 449" role="img" aria-labelledby="title desc"><title id="title">지역 데이터센터를 지지하는 정치인에 대한 비호감</title><desc id="desc">Pew 2026-09-28~10-04 · 미국 등록 유권자(%) 단일 정책행위에 대한 후보 평가 · 데이터센터 또는 AI 전체의 반대 비율 아님 전체 등록 유권자 61%; 민주당 후보 지지자 75%; 공화당 후보 지지자 44%</desc><rect width="1160" height="449" fill="white"/><text x="65" y="53" font-size="26" font-weight="700" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif">지역 데이터센터를 지지하는 정치인에 대한 비호감</text><text x="65" y="86" font-size="17" fill="#51677c" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif">Pew 2026-09-28~10-04 · 미국 등록 유권자(%)</text><line x1="360" y1="118" x2="360" y2="319" stroke="#e1e7ef"/><text x="360" y="339" font-size="14" text-anchor="middle" fill="#66778b">0%</text><line x1="535" y1="118" x2="535" y2="319" stroke="#e1e7ef"/><text x="535" y="339" font-size="14" text-anchor="middle" fill="#66778b">25%</text><line x1="710" y1="118" x2="710" y2="319" stroke="#e1e7ef"/><text x="710" y="339" font-size="14" text-anchor="middle" fill="#66778b">50%</text><line x1="885" y1="118" x2="885" y2="319" stroke="#e1e7ef"/><text x="885" y="339" font-size="14" text-anchor="middle" fill="#66778b">75%</text><line x1="1060" y1="118" x2="1060" y2="319" stroke="#e1e7ef"/><text x="1060" y="339" font-size="14" text-anchor="middle" fill="#66778b">100%</text><text x="345" y="162" text-anchor="end" font-size="17" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif">전체 등록 유권자</text><rect x="360" y="136" width="427" height="35" rx="5" fill="#3469a6" data-key="all" data-value="61"/><text x="799" y="162" font-size="18" font-weight="600" fill="#203247">61%</text><text x="345" y="225" text-anchor="end" font-size="17" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif">민주당 후보 지지자</text><rect x="360" y="199" width="525" height="35" rx="5" fill="#3469a6" data-key="dem" data-value="75"/><text x="897" y="225" font-size="18" font-weight="600" fill="#203247">75%</text><text x="345" y="288" text-anchor="end" font-size="17" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif">공화당 후보 지지자</text><rect x="360" y="262" width="308" height="35" rx="5" fill="#3469a6" data-key="rep" data-value="44"/><text x="680" y="288" font-size="18" font-weight="600" fill="#203247">44%</text><text x="65" y="405" font-size="14" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" fill="#4d6278">단일 정책행위에 대한 후보 평가 · 데이터센터 또는 AI 전체의 반대 비율 아님</text></svg>