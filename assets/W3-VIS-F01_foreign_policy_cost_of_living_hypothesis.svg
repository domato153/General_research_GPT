<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="460" viewBox="0 0 1240 460" role="img" aria-labelledby="title desc"><title id="title">전쟁·관세와 생활비 인식을 거쳐 국정·투표 평가로 이어지는 가설</title><desc id="desc">분석을 위한 가능한 경로: 이란 전쟁 및 관세; 실제 가격 변화와 생활비 악영향 인식; 대통령 국정 평가와 투표 판단. 마지막 화살표는 인과효과가 아직 식별되지 않았으므로 점선.</desc><rect width="1240" height="460" fill="white"/><text x="72" y="49" font-size="24" font-weight="bold" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif">국제정세 · 체감경제 · 투표 판단 — 가설 구조</text><rect x="52" y="145" width="345" height="110" rx="14" fill="#edf3fb" stroke="#a1bbda" stroke-width="2"/><text x="224.5" y="180" text-anchor="middle" font-size="21" font-weight="bold" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif">이란 전쟁 · 관세정책</text><text x="224.5" y="214" text-anchor="middle" font-size="14" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" fill="#475f79">2025~26년 정책·사건</text><rect x="449" y="145" width="345" height="110" rx="14" fill="#edf3fb" stroke="#a1bbda" stroke-width="2"/><text x="621.5" y="180" text-anchor="middle" font-size="21" font-weight="bold" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif">에너지 가격 · 생활비 인식</text><text x="621.5" y="214" text-anchor="middle" font-size="14" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" fill="#475f79">관측 가격과 설문 응답은 구별</text><rect x="846" y="145" width="345" height="110" rx="14" fill="#edf3fb" stroke="#a1bbda" stroke-width="2"/><text x="1018.5" y="180" text-anchor="middle" font-size="21" font-weight="bold" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif">국정 평가 · 의회 투표 판단</text><text x="1018.5" y="214" text-anchor="middle" font-size="14" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" fill="#475f79">인과 크기 및 경로 미식별</text><line x1="401" y1="200" x2="442" y2="200" stroke="#3265a4" stroke-width="4"/><polygon points="442,200 431,193 431,207" fill="#3265a4"/><line x1="798" y1="200" x2="840" y2="200" stroke="#b25b51" stroke-dasharray="6 6" stroke-width="4"/><polygon points="840,200 829,193 829,207" fill="#b25b51"/><text x="804" y="127" font-size="15" fill="#a04c46">추가 입증 필요</text><text x="72" y="325" font-size="16" fill="#52657d">실측: EIA 주간 주유소 가격 / BLS CPI  ·  인식: Chicago Council 전쟁 영향 86%, 관세 영향 81%</text><text x="72" y="360" font-size="16" fill="#52657d">참고: 86%·81%는 인식 비율이며 실제 정책별 물가상승 기여율이 아님</text><text x="72" y="395" font-size="15" fill="#a04c46">주의: 가능한 설명 경로이지 확정된 인과관계나 국정 승인 변화(%p) 추정치가 아니다</text></svg>