<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420" role="img" aria-labelledby="title desc"><title id="title">2024년 트럼프 투표자의 국정 승인율</title><desc id="desc">Pew 미국 성인 중 2024년 트럼프 투표 검증집단, 2025-02 95%, 2026-10 67%; 민주당 투표전환 비율이 아님</desc><rect width="1050" height="420" fill="white"/><text x="74" y="46" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="25" font-weight="700">2024년 트럼프 투표자 집단의 국정 승인율</text><text x="74" y="77" font-size="16" fill="#4d5f75">Pew Research · 미국 성인 중 2024년 트럼프 투표가 확인된 집단</text><text x="74" y="157" font-size="20">2025-02</text><rect x="220" y="130" width="598.5" height="41" rx="5" fill="#2763b6" data-date="2025-02-02" data-value="95"/><text x="826.5" y="158" font-size="21" font-weight="bold">95%</text><text x="74" y="251" font-size="20">2026-10</text><rect x="220" y="224" width="422.1" height="41" rx="5" fill="#2763b6" data-date="2026-10-04" data-value="67"/><text x="650.1" y="252" font-size="21" font-weight="bold">67%</text><text x="74" y="352" font-size="16" fill="#5d6877">차이: -28%p · 각 시점의 집단 승인율이며, 민주당으로 이동한 유권자 비중이 아님</text><text x="74" y="383" font-size="14" fill="#647184">원출처: Pew Research Center, 2026-10-08 보고서</text></svg>